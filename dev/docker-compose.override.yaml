name: mail-dev

services:
  mysql_mail:
    volumes: !override
      - mysql_mail_data:/var/lib/mysql
      - ./dev/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      interval: 10s
      retries: 10

  dovecot:
    depends_on: !override
      - mysql_mail
    ports: !override
      - "1143:143"
      - "1993:993"
      - "14190:4190"
    volumes: !override
      - ./dev/dovecot:/etc/dovecot:ro
      - mail:/srv/mail
      - ./dev/certs:/etc/dovecot_certs:ro
      - mail_spool:/var/spool/mail
    networks: !override
      - mail_internal
    logging:
      driver: json-file
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 143 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postfix:
    depends_on:
      mysql_mail:
        condition: service_healthy
      dovecot:
        condition: service_healthy
    environment:
      MYHOSTNAME: "localhost"
      MYNETWORKS: "172.0.0.0/8"
      DKIM_DOMAINS: "dev.local"
      DKIM_SELECTOR: "dev"
      MAIL_HOSTNAME: "localhost"
    ports: !override
      - "1025:25"
      - "1465:465"
      - "1587:587"
    volumes: !override
      - mail:/var/mail
      - mail_spool:/var/spool/postfix
      - spamass_vhome:/vhome/users
      - ./dev/certs:/etc/postfix/certs:ro
    networks: !override
      - mail_internal
    logging:
      driver: json-file

  postfixadmin:
    ports: !override
      - "8080:80"
    networks: !override
      - mail_internal

