dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

mail_driver = maildir
mail_path = /srv/mail/%{user}/

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
  }
  mailbox Trash {
    special_use = \Trash
  }
  prefix =
}

protocols = imap sieve lmtp
mail_plugins {
  quota = yes
  quota_clone = yes
}

# set to 'no' if you don't have ssl cert/keys, and comment out ssl_cert/ssl_key
# or set to 'required' and specify ssl_cert/ssl_key
#ssl = no
ssl = required
#verbose_ssl = yes
ssl_server_cert_file = /etc/dovecot_certs/fullchain.pem
ssl_server_key_file = /etc/dovecot_certs/key.pem
ssl_min_protocol = TLSv1.2


# login is for outlook express smtpd auth
auth_mechanisms = plain login

# If you're having trouble, try uncommenting these:
#auth_debug = yes
#auth_debug_passwords = yes

!include dovecot-sql.conf.ext

# Provide authentication to Postfix SMTP server
service auth {
   unix_listener /var/spool/mail/private/auth {
       mode = 0666 # opened socket to others since postfix and dovecot containers have different UIDs
       user = dovecot
       group = dovecot
   }
}

# required for sieve ':redirect'
submission_host = smtp.nesono.com:25

# LMTP is needed for sieve filtering
service lmtp {
    unix_listener /var/spool/mail/private/dovecot-lmtp {
        mode = 0666 # opened socket to others since postfix and dovecot containers have different UIDs
        user = dovecot
        group = dovecot
    }
}

# Use sieve for LMTP
protocol lmtp {
  mail_fsync = optimized
  mail_plugins {
    sieve = yes
  }
}

# Enable mail process debugging
# mail_debug = yes

# Needs to match Postfix virtual_uid_maps
# This needs to be in sync with the postfix image configuration for the vmail user and group
# see also the postfix-for-postfixadmin repository
first_valid_uid = 3000
last_valid_uid = 3000

# Network authentication requires TLS; Postfix SASL uses the UNIX socket.
auth_allow_cleartext = no

# Count quota locally and mirror usage into PostfixAdmin's existing quota2 table.
quota "User quota" {
  driver = count
}
quota_clone {
  dict proxy {
    name = sqlquota
  }
}
dict_server {
  dict sqlquota {
    driver = sql
    !include dovecot-dict-quota.conf.ext
  }
}

service dict {
  unix_listener dict {
    mode = 0660
    group = mail
  }
}

service managesieve-login {
#   inet_listener sieve {
#    port = 4190
#   }
}

service managesieve {
  # Max. number of ManageSieve processes (connections)
#   process_limit = 1024
}

# Service configuration

protocol sieve {
  # Maximum ManageSieve command line length in bytes. ManageSieve usually does
  # not involve overly long command lines, so this setting will not normally need
  # adjustment
#   managesieve_max_line_length = 65536

  # Maximum number of ManageSieve connections allowed for a user from each IP address.
  # NOTE: The username is compared case-sensitively.
#   mail_max_userip_connections = 10
}

sieve_script personal {
  driver = file
  path = /srv/mail/%{user}/sieve
  active_path = /srv/mail/%{user}/dovecot.sieve
}
recipient_delimiter = +

# stats exporter
service stats {
  inet_listener http {
    listen = 0.0.0.0
    port = 9900
  }
  unix_listener stats-writer {
    group = dovecot
    mode = 0660
    user = dovecot
  }

  unix_listener stats-reader {
    group = dovecot
    mode = 0660
    user = dovecot
  }
}

metric auth_success {
  filter = (event=auth_request_finished AND success=yes)
}

metric auth_fail {
  filter = (event=auth_request_finished AND NOT success=yes)
}

metric imap_command {
  filter = event=imap_command_finished
  group_by cmd_name {
    method discrete {
    }
  }
  group_by tagged_reply_state {
    method discrete {
    }
  }
}

metric smtp_command {
  filter = event=smtp_server_command_finished
  group_by cmd_name {
    method discrete {
    }
  }
  group_by status_code {
    method discrete {
    }
  }
  group_by duration {
    method exponential {
      base = 10
      min_magnitude = 1
      max_magnitude = 5
    }
  }
}

metric mail_delivery {
  filter = event=mail_delivery_finished
  group_by duration {
    method exponential {
      base = 10
      min_magnitude = 1
      max_magnitude = 5
    }
  }
}

log_path=/dev/stdout
info_log_path=/dev/stdout
debug_log_path=/dev/stdout
